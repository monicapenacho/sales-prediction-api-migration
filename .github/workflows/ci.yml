name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt ruff pytest

    - name: Lint
      run: ruff check app tests

    - name: Tests
      run: pytest

    - name: Build Docker image
      run: docker build -t sales-api .

    # 🔹 LOGIN A ACR (forma correcta y simple)
    - name: Login to ACR
      run: docker login ${{ secrets.ACR_LOGIN_SERVER }} \
           -u ${{ secrets.ACR_USERNAME }} \
           -p ${{ secrets.ACR_PASSWORD }}

    - name: Tag image
      run: docker tag sales-api ${{ secrets.ACR_LOGIN_SERVER }}/sales-api:latest

    - name: Push image
      run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/sales-api:latest