name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [principal]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint con ruff
        run: ruff check app/ tests/

      - name: Ejecutar tests con cobertura
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sales-api .

      - name: Login to ACR
        run: docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

      - name: Tag image
        run: docker tag sales-api ${{ secrets.ACR_LOGIN_SERVER }}/sales-api:latest

      - name: Push image
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/sales-api:latest
