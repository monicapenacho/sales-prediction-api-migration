"""
Docker Compose for local development and testing.
Allows running the API locally before deploying to Azure.

Usage:
  docker-compose up --build
  curl http://localhost:8000/health
"""

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=1.0.0
      - APP_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3